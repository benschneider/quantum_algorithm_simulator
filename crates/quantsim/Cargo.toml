[package]
name = "quantsim"
version = "0.2.2"
edition = "2021"
authors = ["Ben Schneider"]
license = "MIT OR Apache-2.0"
description = "A quantum circuit simulator ecosystem"
repository = "https://github.com/benschneider/quantum_algorithm_simulator"
keywords = ["quantum", "simulation", "circuit", "physics", "education"]
categories = ["science", "simulation"]

[dependencies]
quantsim_core = { version = "0.2.2", path = "../quantsim_core" }
quantsim_ui = { version = "0.2.2", path = "../quantsim_ui" }
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
log = "0.4.27"

[dev-dependencies]
env_logger = "0.11.3"

[build-dependencies]
serde_json = "1.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
